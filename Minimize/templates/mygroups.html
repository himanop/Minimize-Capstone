<!DOCTYPE html>
<html>
<head>
    <title>My Groups</title>
</head>
<body>
    <a href="{{ url_for('dashboard') }}">Back to my dashboard</a>
    <h1>My Groups</h1>

    <!-- Create Group Button -->
    <a href="{{ url_for('creategroup') }}">
        <button style="padding: 10px 20px; font-size: 16px; background-color: blue; color: white; border: none; cursor: pointer;">
            Create New Group
        </button>
    </a>

    <br><br>

    {% if current_user.groups %}
        <h2>Your Groups</h2>
        <ul>
            {% for group in current_user.groups %}
                <li>
                    <img src="{{ url_for('static', filename='group_pics/' + group.profile_picture) }}" 
                         alt="Group Profile Picture" 
                         style="width: 100px; height: 100px; border-radius: 50%;">
                    <strong>{{ group.group_name }}</strong> - {{ group.address }}
                    
                    <!-- View Group Button -->
                    <a href="{{ url_for('view_group', group_id=group.id) }}">
                        <button style="margin-left: 10px; padding: 5px 10px;">View Group</button>
                    </a>
                    
                    <!-- Leave Group Button -->
                    <form method="POST" action="{{ url_for('leave_group', group_id=group.id) }}" style="display:inline;">
                        <button type="submit" style="margin-left: 10px; padding: 5px 10px; background-color: red; color: white; border: none; cursor: pointer;">
                            Leave Group
                        </button>
                    </form>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>You are not in any groups yet.</p>
    {% endif %}

</body>
</html>
