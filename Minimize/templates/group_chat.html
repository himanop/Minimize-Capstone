<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ group.group_name }} Chat</title>
    <style>
        .chat-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        .messages {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
        }
        .message {
            margin-bottom: 10px;
        }
        .message .username {
            font-weight: bold;
        }
        .message .timestamp {
            font-size: 0.8em;
            color: #666;
        }
        .message .content {
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <h1>{{ group.group_name }} Chat</h1>

        <!-- Display messages -->
        <div class="messages">
            {% for message in messages %}
                <div class="message">
                    <div class="username">{{ message.user.username }}</div>
                    <div class="timestamp">{{ message.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}</div>
                    <div class="content">{{ message.content }}</div>
                </div>
            {% endfor %}
        </div>

        <!-- Form to send a new message -->
        <form method="POST" action="{{ url_for('group_chat', group_id=group.id) }}">
            <textarea name="content" placeholder="Type your message..." required></textarea>
            <button type="submit">Send</button>
        </form>

        <a href="{{ url_for('view_group', group_id=group.id) }}">Back to Group</a>
    </div>
</body>
</html>
