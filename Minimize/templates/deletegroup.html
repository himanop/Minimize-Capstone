{% extends "base.html" %}

{% block title %}Delete Group{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card border-danger shadow-sm rounded">
      <div class="card-header bg-danger text-white">
        <h4 class="mb-0">Delete Group</h4>
      </div>
      <div class="card-body">
        <p>Are you sure you want to delete <strong>{{ group.group_name }}</strong>?</p>
        <p class="text-danger">This action cannot be undone.</p>

        <form method="POST" class="mb-3">
          <button type="submit" class="btn btn-danger">Yes, Delete Group</button>
          <a href="{{ url_for('view_group', group_id=group.id) }}" class="btn btn-secondary ms-2">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
