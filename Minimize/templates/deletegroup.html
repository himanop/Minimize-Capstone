<!DOCTYPE html>
<html>
<head>
    <title>Delete Group</title>
</head>
<body>

    <h1>Delete Group</h1>
    <p>Are you sure you want to delete <strong>{{ group.group_name }}</strong>?</p>
    <p>This action cannot be undone.</p>

    <form method="POST">
        <button type="submit" style="background-color: red; color: white;">Yes, Delete Group</button>
    </form>

    <br>
    <a href="{{ url_for('view_group', group_id=group.id) }}">Cancel</a>

</body>
</html>
