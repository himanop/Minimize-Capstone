<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Group</title>
</head>
<body>
    <h1>{{ group.group_name }}</h1>
    <img src="{{ url_for('static', filename='group_pics/' + group.profile_picture) }}" alt="Group Profile Picture" width="100">
    <p>Address: {{ group.address }}</p>

    <h2>Members</h2>
    <ul>
        {% for member in group.members %}
            <li>
                <a href="{{ url_for('view_user', user_id=member.id) }}">
                    {{ member.username }} ({{ member.first_name }} {{ member.last_name }})
                </a>
            </li>
        {% endfor %}
    </ul>

    <a href="{{ url_for('mygroups') }}">Back to My Groups</a>
</body>
</html>
