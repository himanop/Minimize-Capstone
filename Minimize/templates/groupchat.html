<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Group Chat - {{ group.group_name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-3">Group Chat - {{ group.group_name }}</h2>

    <div class="card">
        <div class="card-body">
            <div id="chat-box" class="mb-3 border rounded p-3" 
                 style="height: 300px; overflow-y: scroll; background-color: #f9f9f9;">
                {% for message in messages %}
                    <div class="mb-2">
                        <strong>{{ message.user.username }}</strong> 
                        <small class="text-muted">{{ message.timestamp.strftime('%H:%M') }}</small><br>
                        {{ message.content }}
                    </div>
                {% endfor %}
            </div>

            <form id="chat-form" class="d-flex">
                <input type="text" id="chat-input" class="form-control me-2" placeholder="Type your message..." required>
                <button class="btn btn-primary" type="submit">Send</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const socket = io();
        const groupId = JSON.parse('{{ group.id | tojson | safe }}');
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');

        socket.emit('join', { group_id: groupId });

        chatForm.addEventListener('submit', function (e) {
            e.preventDefault();
            const message = chatInput.value.trim();
            if (message) {
                socket.emit('send_message', {
                    msg: message,
                    group_id: groupId
                });
                chatInput.value = '';
            }
        });

        socket.on('receive_message', function (data) {
            const msgElement = document.createElement('div');
            msgElement.classList.add('mb-2');
            msgElement.innerHTML = `<strong>${data.username}</strong> 
                <small class="text-muted">${data.timestamp}</small><br>${data.msg}`;
            chatBox.appendChild(msgElement);
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    });
</script>
</body>
</html>
