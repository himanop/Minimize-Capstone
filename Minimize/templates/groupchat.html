{% extends "base.html" %}

{% block title %}Group Chat - {{ group.group_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-10">
    <div class="card shadow-sm rounded">
      <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Group Chat - {{ group.group_name }}</h5>
        <a href="{{ url_for('view_group', group_id=group.id) }}" class="btn btn-light btn-sm">← Back to Group</a>
      </div>
      <div class="card-body">
        <div id="chat-box" class="border rounded p-3 mb-3"
             style="height: 300px; overflow-y: scroll; background-color: #f9f9f9;">
          <!-- Messages will load here -->
        </div>

        <form id="chat-form" class="d-flex">
          <input type="text" id="chat-input" class="form-control me-2" placeholder="Type your message..." required>
          <button class="btn btn-success" type="submit">Send</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  const groupId = "{{ group.id }}";
  const chatBox = document.getElementById('chat-box');
  const chatForm = document.getElementById('chat-form');
  const chatInput = document.getElementById('chat-input');

  // Load messages from server
  async function loadMessages() {
    const response = await fetch(`/group/${groupId}/chat/messages`);
    // Below we convert the response to JSON
    if (!response.ok) {
      console.error('Failed to load messages:', response.statusText);
      return;
    }
    // Assuming the server returns a JSON array of messages
    // Each message should have properties: username, timestamp, and content
    // Example: [{ "username": "Alice", "timestamp": "2023-10-01 12:00", "content": "Hello!" }, ...]
    const messages = await response.json();
    // Clear the chat box before appending new messages
    // Assuming messages are sorted by timestamp in descending order
    // If not, you can sort them here
    chatBox.innerHTML = '';
    // Append each message to the chat box
    messages.forEach(msg => {
      // Create a new div for each message
      const el = document.createElement('div');
      // Set the inner HTML of the div
      // Use template literals for better readability
      el.classList.add('mb-2');
      // Assuming msg has properties: username, timestamp, and content
      el.innerHTML = `<strong>${msg.username}</strong> 
                      <small class="text-muted">${msg.timestamp}</small><br>
                      ${msg.content}`;
      chatBox.appendChild(el);
    });
    // Line below automatically scrolls the chat window to the bottom so the newest messages
    // are always visible without the user having to scroll manually.
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  // Send new message via AJAX
  chatForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    const message = chatInput.value.trim();
    if (message) {
      await fetch(`/group/${groupId}/chat/send`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message })
      });
      chatInput.value = '';
      loadMessages();  // Immediately reload messages
    }
  });

  // Load messages every 3 seconds
  setInterval(loadMessages, 3000);
  loadMessages();  // Load immediately on page load
</script>
{% endblock %}
