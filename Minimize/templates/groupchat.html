<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Group Chat - {{ group.group_name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-3">Group Chat - {{ group.group_name }}</h2>

    <div class="card">
        <div class="card-body">
            <div id="chat-box" class="mb-3 border rounded p-3"
                 style="height: 300px; overflow-y: scroll; background-color: #f9f9f9;">
                <!-- Messages will load here -->
            </div>

            <form id="chat-form" class="d-flex">
                <input type="text" id="chat-input" class="form-control me-2" placeholder="Type your message..." required>
                <button class="btn btn-primary" type="submit">Send</button>
            </form>
        </div>
    </div>
</div>
<a href = "{{ url_for('view_group', group_id=group.id) }}">Back to Group</a>

<script>
    const groupId = "{{ group.id }}";
    const chatBox = document.getElementById('chat-box');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');

    // Load messages from server
    async function loadMessages() {
        const response = await fetch(`/group/${groupId}/chat/messages`);
        const messages = await response.json();

        chatBox.innerHTML = '';
        messages.forEach(msg => {
            const el = document.createElement('div');
            el.classList.add('mb-2');
            el.innerHTML = `<strong>${msg.username}</strong> <small class="text-muted">${msg.timestamp}</small><br>${msg.content}`;
            chatBox.appendChild(el);
        });

        // Scroll to bottom
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Send new message via AJAX
    chatForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        const message = chatInput.value.trim();
        if (message) {
            await fetch(`/group/${groupId}/chat/send`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            });
            chatInput.value = '';
            loadMessages();  // Immediately reload messages
        }
    });

    // Load messages every 3 seconds
    setInterval(loadMessages, 3000);
    loadMessages();  // Load immediately on page load
</script>
</body>
</html>
